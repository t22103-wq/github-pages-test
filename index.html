
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GitHub Pages 実験室</title>

  <style>
    body {
      background-color: #eaf4ff;
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #1769aa;
      font-size: 36px;
    }

    p {
      color: #ff4500;
      font-size: 20px;
      font-weight: bold; 
    }

    .message {
      background-color: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 500px;
      margin: 30px auto;
    }
  </style>
</head>
  
<body>
  <h1>GitHub Pages 実験室</h1>

  <p id="message">ボタンを押してみよう！</p>

  <button id="changeButton">クリック！</button>

  <script>
    const button = document.getElementById("changeButton");
    const message = document.getElementById("message");

    button.addEventListener("click", function() {
      message.textContent = "JavaScriptが動いたよ！";
    });
  </script>
</body>
</html>
